<body>
<noscript><p style="padding:24px;color:#fff">Vui lòng bật JavaScript để mở món quà.</p></noscript>
<div id="rot"><h2>Xoay ngang một chút nhé!</h2><p>Xoay ngang điện thoại hoặc iPad để xem đẹp nhất. Mở trong Zalo thì nhấn dấu ba chấm và chọn mở bằng trình duyệt ngoài.</p><button class="btn" id="rotskip">Vẫn xem dọc</button></div>
<button id="mus" aria-label="Bật hoặc tắt nhạc">♪</button>

<section class="stage on" id="cover" tabindex="0" role="button" aria-label="Chạm để bắt đầu">
  <div class="seal"><span>20/11</span></div>

  <div class="ledge"></div>
  <button class="btn" data-next>Mở lá thư</button>
</section>

  <button class="btn" data-next>Xem kỷ niệm</button>
</section>
